# Filtered at build time by Maven. The value is the CLI module's own version, so
# `tibyan version` reports the build it actually came from. Never hardcode here.
#
# The @...@ delimiters are required: spring-boot-starter-parent sets
# resource.delimiter to @ and disables the default ${...} form, so ${project.version}
# would be copied through unsubstituted.
#
# The file name is deliberately distinct from the runtime module's
# tibyan/runtime-version.properties. Both modules can land in one shaded
# jar-with-dependencies, where two resources sharing a path would collide and one
# would silently win.
version=@project.version@
