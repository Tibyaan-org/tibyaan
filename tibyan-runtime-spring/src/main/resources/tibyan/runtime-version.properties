# Filtered at build time by Maven. The value is the runtime module's own version,
# which is the Tibyaan tool version, so the MCP server advertises what actually
# produced it. Never hardcode a version here.
#
# The @...@ delimiters are required, not a style choice: spring-boot-starter-parent
# sets resource.delimiter to @ and disables the default ${...} form, so a
# ${project.version} here is copied through verbatim and never substituted.
version=@project.version@
